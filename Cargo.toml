[package]
name = "llm-pipeline-tools"
version = "0.3.0"
edition = "2024"
description = "Typed recon workflows and compact-output evidence tools"
license = "MIT"

[dependencies]
base64 = "0.22"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
regex = "1.12"
serde_json = "1.0"
sha2 = "0.10"
url = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
